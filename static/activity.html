<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a0a0f">
  <meta name="description" content="Unified developer activity feed">
  <title>activity · git dashboard</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192x192.png">
</head>
<body>
  <header>
    <nav class="nav-tabs">
      <a href="/" class="nav-tab">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter"><line x1="6" y1="3" x2="6" y2="15"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M18 9a9 9 0 0 1-9 9"/></svg>
        Commits
      </a>
      <a href="agents.html" class="nav-tab">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter"><rect width="8" height="8" x="2" y="2" rx="1"/><path d="M14 2c1.1 0 2 .9 2 2v4c0 1.1-.9 2-2 2"/><path d="M20 2c1.1 0 2 .9 2 2v4c0 1.1-.9 2-2 2"/><path d="M10 22H5a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h5"/><path d="M16 22h5a2 2 0 0 0 2-2v-7a2 2 0 0 0-2-2h-5"/><path d="M16 2h5a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-5"/><path d="M16 18h5a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-5"/><path d="M2 18h5a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2H2"/><path d="M2 2h5a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2H2"/></svg>
        Agents
      </a>
      <a href="activity.html" class="nav-tab active">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
        Activity
      </a>
    </nav>
    <div class="activity-filters">
      <button id="filter-commit" class="btn-sm filter-btn active" data-type="commit">Commits</button>
      <button id="filter-agent" class="btn-sm filter-btn active" data-type="agent">Agents</button>
      <button id="filter-pull" class="btn-sm filter-btn active" data-type="pull">Pulls</button>
    </div>
  </header>
  <main>
    <div id="activity-empty" class="activity-empty hidden">
      <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
      <p>No activity yet</p>
      <span>Events will appear here as they happen</span>
    </div>
    <div id="activity-feed" class="activity-feed"></div>
    <div id="activity-loading" class="loading">loading…</div>
    <div id="activity-error" class="error hidden"></div>
  </main>
  <script src="utils.js"></script>
  <script src="activity.js"></script>
</body>
</html>
