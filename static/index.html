<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a0a0f">
  <meta name="description" content="A dashboard for monitoring Git repositories and agent activities">
  <title>git dashboard</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <script>
    (function() {
      var t = localStorage.getItem('dashboard-theme') || 'dark';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <link rel="apple-touch-icon" href="icons/icon-192x192.png">
</head>
<body>
  <header>
    <nav class="nav-tabs">
      <a href="/" class="nav-tab active">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter"><line x1="6" y1="3" x2="6" y2="15"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M18 9a9 9 0 0 1-9 9"/></svg>
        Commits
      </a>
<a href="agents.html" class="nav-tab">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter"><rect width="8" height="8" x="2" y="2" rx="1"/><path d="M14 2c1.1 0 2 .9 2 2v4c0 1.1-.9 2-2 2"/><path d="M20 2c1.1 0 2 .9 2 2v4c0 1.1-.9 2-2 2"/><path d="M10 22H5a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h5"/><path d="M16 22h5a2 2 0 0 0 2-2v-7a2 2 0 0 0-2-2h-5"/><path d="M16 2h5a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-5"/><path d="M16 18h5a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-5"/><path d="M2 18h5a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2H2"/><path d="M2 2h5a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2H2"/></svg>
        Agents
      </a>
      <a href="activity.html" class="nav-tab">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
        Activity
      </a>
    </nav>
    <div class="search-container">
      <input type="search" id="search-input" class="search-input" placeholder="Search commits..." autocomplete="off">
      <button id="search-btn" class="btn-sm search-btn" type="button">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      </button>
      <button id="filter-toggle" class="btn-sm filter-toggle" type="button" title="Toggle filters">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 3H2l8 9.46V19l4 2v-8.54L22 3z"/></svg>
      </button>
    </div>
    <div id="filter-panel" class="filter-panel hidden">
      <div class="filter-row">
        <label for="filter-repo">Repo</label>
        <select id="filter-repo" class="filter-select">
          <option value="">All repos</option>
        </select>
      </div>
      <div class="filter-row">
        <label for="filter-author">Author</label>
        <input type="text" id="filter-author" class="filter-input" placeholder="Author name">
      </div>
      <div class="filter-row">
        <label for="filter-date">After</label>
        <input type="date" id="filter-date" class="filter-input">
      </div>
    </div>
    <button id="theme-toggle" class="btn-sm" type="button" title="Toggle theme">
      <svg id="theme-icon-dark" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      <svg id="theme-icon-light" class="hidden" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
      <svg id="theme-icon-contrast" class="hidden" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 2v20" stroke-width="3"/></svg>
    </button>
    <button id="settings-toggle" class="btn-sm" type="button" title="Preferences">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </header>
  <div id="settings-panel" class="settings-panel hidden">
    <div class="settings-row">
      <label for="density-select">Card density</label>
      <select id="density-select" class="settings-select">
        <option value="compact">Compact</option>
        <option value="comfortable">Comfortable</option>
      </select>
    </div>
    <div class="settings-row">
      <label for="sort-select">Sort order</label>
      <select id="sort-select" class="settings-select">
        <option value="recent">Recent first</option>
        <option value="alphabetical">Alphabetical</option>
      </select>
    </div>
  </div>
  <main>
    <div id="search-results" class="search-results hidden"></div>
    <div id="projects"></div>
  </main>
  <script src="themes.js"></script>
  <script src="preferences.js"></script>
  <script src="utils.js"></script>
  <script src="health.js"></script>
  <script src="notifications.js"></script>
  <script src="branches.js"></script>
  <script src="app.js"></script>
</body>
</html>
